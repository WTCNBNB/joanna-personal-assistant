[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joanna-personal-assistant"
version = "0.1.0"
description = "Local-first personal evidence and reasoning kernel"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joanna contributors" }]
keywords = ["personal-assistant", "local-first", "sqlite", "llm", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
joanna = "joanna.app.cli:main"

[tool.setuptools.packages.find]
include = ["joanna*"]
